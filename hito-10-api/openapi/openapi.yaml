            default: 20
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: limit
          required: false
        - schema:
            type: string
            pattern: ^F2030-[A-Z0-9-]{1,40}$
          in: path
          name: id
          required: true
      security:
        - bearerSession: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
