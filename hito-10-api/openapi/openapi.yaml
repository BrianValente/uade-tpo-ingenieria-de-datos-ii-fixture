openapi: 3.0.3
info:
  title: Fixture 2030 API
  version: 0.1.0
  description: Base del Hito 10. El estado HTTP no comprueba la conectividad de
    las bases NoSQL.
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      description: Token opaco recibido al iniciar sesión. No es un JWT.
  schemas:
    ApiErrorInput:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - code
        - message
        - requestId
    UserInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        username:
          type: string
        role:
          type: string
          enum:
            - user
            - admin
      required:
        - id
        - username
        - role
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - code
        - message
        - requestId
      additionalProperties: false
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        username:
          type: string
        role:
          type: string
          enum:
            - user
            - admin
      required:
        - id
        - username
        - role
      additionalProperties: false
paths:
  /auth/login:
    post:
      operationId: login
      summary: Inicia una sesión de laboratorio
      tags:
        - Autenticación
      description: Valida Argon2id contra MongoDB y crea una sesión Redis de 1800
        segundos. Cada login crea otra sesión. El token se muestra solo en esta
        respuesta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  pattern: ^[a-z][a-z0-9._-]{2,31}$
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - username
                - password
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    pattern: ^[A-Za-z0-9_-]{43}$
                  tokenType:
                    type: string
                    enum:
                      - Bearer
                  expiresIn:
                    type: number
                    enum:
                      - 1800
                  user:
                    $ref: "#/components/schemas/User"
                required:
                  - accessToken
                  - tokenType
                  - expiresIn
                  - user
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/session:
    get:
      operationId: getCurrentSession
      summary: Consulta la sesión actual
      tags:
        - Autenticación
      description: Lee un hash Redis con TTL positivo. No renueva el vencimiento. Una
        sesión ausente o expirada produce 401; Redis inaccesible produce 503.
      security:
        - bearerSession: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  lastActivity:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  ttlSeconds:
                    type: integer
                    minimum: 1
                    maximum: 1800
                required:
                  - user
                  - createdAt
                  - lastActivity
                  - ttlSeconds
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: logout
      summary: Cierra la sesión actual
      tags:
        - Autenticación
      description: "Elimina solo la sesión del token Bearer. Devuelve 204 aunque ya no
        exista: repetir el cierre es idempotente. No confirma el cierre si Redis
        falla."
      security:
        - bearerSession: []
      responses:
        "204":
          description: Sesión cerrada o ya ausente.
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /equipos/{codigo}:
    get:
      tags:
        - MongoDB
      parameters:
        - schema:
            type: string
            pattern: ^[A-Z]{3}$
          in: path
          name: codigo
          required: true
      security:
        - bearerSession: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  code:
                    type: string
                    pattern: ^[A-Z]{3}$
                  name:
                    type: string
                  confederation:
                    type: string
                  selectionOrigin:
                    type: string
                  qualificationStage:
                    type: string
                  participates:
                    type: boolean
                  trainingBase:
                    type: string
                required:
                  - id
                  - code
                  - name
                  - confederation
                  - selectionOrigin
                  - qualificationStage
                  - participates
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /equipos/{codigo}/jugadores:
    get:
      tags:
        - MongoDB
      parameters:
        - schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 100000
          in: query
          name: page
          required: false
        - schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: limit
          required: false
        - schema:
            type: string
            pattern: ^[A-Z]{3}$
          in: path
          name: codigo
          required: true
      security:
        - bearerSession: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        teamId:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        teamCode:
                          type: string
                          pattern: ^[A-Z]{3}$
                        firstName:
                          type: string
                        lastName:
                          type: string
                        birthDate:
                          type: string
                        position:
                          type: string
                        number:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        heightCm:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        preferredFoot:
                          type: string
                        selected:
                          type: boolean
                        available:
                          type: boolean
                        synthetic:
                          type: boolean
                      required:
                        - id
                        - teamId
                        - teamCode
                        - firstName
                        - lastName
                        - birthDate
                        - position
                        - number
                        - heightCm
                        - preferredFoot
                        - selected
                        - available
                        - synthetic
                      additionalProperties: false
                  total:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  page:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  limit:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - items
                  - total
                  - page
                  - limit
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /partidos/{id}:
    get:
      tags:
        - Neo4j
        - MongoDB
      parameters:
        - schema:
            type: string
            pattern: ^F2030-[A-Z0-9-]{1,40}$
          in: path
          name: id
          required: true
      security:
        - bearerSession: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    pattern: ^F2030-[A-Z0-9-]{1,40}$
                  date:
                    type: string
                  time:
                    type: string
                  phase:
                    type: string
                  homeCode:
                    type: string
                    pattern: ^[A-Z]{3}$
                  awayCode:
