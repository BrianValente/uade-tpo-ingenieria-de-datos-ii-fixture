                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      city:
                        type: string
                      country:
                        type: string
                      region:
                        type: string
                    required:
                      - id
                      - name
                      - city
                      - country
                      - region
                    additionalProperties: false
                  home:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      code:
                        type: string
                        pattern: ^[A-Z]{3}$
                      name:
                        type: string
                      confederation:
                        type: string
                      selectionOrigin:
                        type: string
                      qualificationStage:
                        type: string
                      participates:
                        type: boolean
                      trainingBase:
                        type: string
                    required:
                      - id
                      - code
                      - name
                      - confederation
                      - selectionOrigin
                      - qualificationStage
                      - participates
                    additionalProperties: false
                  away:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      code:
                        type: string
                        pattern: ^[A-Z]{3}$
                      name:
                        type: string
                      confederation:
                        type: string
                      selectionOrigin:
                        type: string
                      qualificationStage:
                        type: string
                      participates:
                        type: boolean
                      trainingBase:
                        type: string
                    required:
                      - id
                      - code
                      - name
                      - confederation
                      - selectionOrigin
                      - qualificationStage
                      - participates
                    additionalProperties: false
                required:
                  - id
                  - date
                  - time
                  - phase
                  - homeCode
                  - awayCode
                  - venue
                  - home
                  - away
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Default Response
          content:
            application/json:
