apiVersion: 1

datasources:
  - name: Prometheus Fixture 2030
    type: prometheus
    uid: prometheus_fixture2030
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "5s"
      httpMethod: POST
  - name: Loki Fixture 2030
    type: loki
    uid: loki_fixture2030
    access: proxy
    url: http://consultas:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id"\s*:\s*"([0-9a-f]{32})"'
          url: '/d/fixture2030-pedido/pedido?var-traceId=$${__value.raw}'
          urlDisplayLabel: Ver traza y log
  - name: Tempo Fixture 2030
    type: tempo
    uid: tempo_fixture2030
    access: proxy
    url: http://consultas:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki_fixture2030
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        customQuery: true
        query: '{service_name="fixture2030-api"} |= "$${__span.traceId}"'
