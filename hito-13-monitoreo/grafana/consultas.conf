worker_processes 1;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 3100;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        location ~ ^/(ready|loki/api/v1/(query|query_range|labels|label/[A-Za-z0-9_]+/values|series|index/stats|index/volume|status/buildinfo))$ {
            proxy_pass http://loki:3100$uri$is_args$args;
        }
        location / { return 403; }
    }

    server {
        listen 3200;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        location ~ "^/(ready|api/(echo|status/buildinfo|v2/traces/[0-9a-fA-F]{1,32}|traces/[0-9a-fA-F]{1,32}|search|(?:v2/)?search/tags|(?:v2/)?search/tag/[A-Za-z0-9._:-]+/values))$" {
            proxy_pass http://tempo:3200$uri$is_args$args;
        }
        location / { return 403; }
    }
}
