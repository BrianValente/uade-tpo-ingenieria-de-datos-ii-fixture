name: fixture2030

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:?Defina MONGO_ROOT_USERNAME en .env}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Defina MONGO_ROOT_PASSWORD en .env}"
      MONGO_INITDB_DATABASE: "${MONGO_DATABASE:-fixture2030}"
    volumes:
      - mongodb_data:/data/db
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./lib:/workspace/lib:ro
      - ./schemas:/workspace/schemas:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  cassandra:
    image: cassandra:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - "${HOME}/docker/data/cassandra:/var/lib/cassandra"
      - ./cassandra:/workspace/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE CLUSTER' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  redis:
    image: redis:latest
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1 --loglevel notice --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - "${HOME}/docker/data/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  influxdb:
    # Imagen usada por el docente, segun confirmacion de Brian. Ver influxdb/README.md.
    image: influxdb:3-core
    restart: unless-stopped
    command:
      - influxdb3
      - serve
      - --node-id=fixture2030-local
      - --object-store=file
      - --data-dir=/var/lib/influxdb3
      - --http-bind=0.0.0.0:8181
      - --disable-authz=health
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - "${HOME}/docker/data/influxdb:/var/lib/influxdb3"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mongodb_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
